<article class="note-card">
  <header>
    <h3>{{ note().title }}</h3>
    @if (note().authorId === viewerUid()) {
      <a
        [routerLink]="[routeBase(), 'session', note().appointmentId, 'note', note().id, 'edit']"
        title="Edit note"
        >✎ Edit</a
      >
      <button (click)="remove.emit(note().id)" title="Delete note">⋮ Delete</button>
    }
  </header>
  <p class="note-body">{{ note().body }}</p>
  <footer>Made by {{ note().authorName }} · {{ note().updatedAt | date: 'medium' }}</footer>
</article>
